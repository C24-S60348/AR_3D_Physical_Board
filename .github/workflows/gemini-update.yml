name: Update Repo with Gemini

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: "File path to update (e.g., README.md or src/app.py)"
        required: true
        default: "README.md"
      instruction:
        description: "What should Gemini do to this file?"
        required: true
        default: "Review and improve documentation clarity."

permissions:
  contents: write  # Allows the workflow to push commits back to your repo

jobs:
  gemini-edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Gen AI SDK
        run: pip install google-genai

      - name: Run Gemini update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_FILE: ${{ github.event.inputs.target_file }}
          INSTRUCTION: ${{ github.event.inputs.instruction }}
        run: python update_with_gemini.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.target_file }}"
          git diff --staged --quiet || (git commit -m "chore: update ${{ github.event.inputs.target_file }} via Gemini" && git push)
