name: Update Repo with Gemini

on:
  workflow_dispatch:
    inputs:
      target_paths:
        description: "Files/folders to read ('ALL' for entire repo, or e.g. 'src, README.md')"
        required: true
        default: "ALL"
      instruction:
        description: "What should Gemini build, fix, or update?"
        required: true
        default: "Update README.md to accurately reflect the current codebase."

permissions:
  contents: write

jobs:
  gemini-edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai pydantic

      - name: Run Gemini multi-file update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_PATHS: ${{ github.event.inputs.target_paths }}
          INSTRUCTION: ${{ github.event.inputs.instruction }}
        run: python update_with_gemini.py

      - name: Commit and push all changes
        run: |
          COMMIT_MSG=$(cat .gemini_commit_msg || echo "chore: multi-file update via Gemini")
          rm -f .gemini_commit_msg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "$COMMIT_MSG" && git push)
