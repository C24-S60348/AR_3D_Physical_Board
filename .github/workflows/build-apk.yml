name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        type: choice
        required: true
        default: apk
        options:
          - apk
          - apk-split-per-abi
          - aab
          - apk-and-aab

jobs:
  build:
    name: Build Flutter ${{ inputs.build_type }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "::warning::KEYSTORE_BASE64 not set - falling back to debug signing."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FLAGS="--release --no-tree-shake-icons"
          case "${{ inputs.build_type }}" in
            apk)               flutter build apk $FLAGS ;;
            apk-split-per-abi) flutter build apk $FLAGS --split-per-abi ;;
            aab)               flutter build appbundle $FLAGS ;;
            apk-and-aab)       flutter build apk $FLAGS && flutter build appbundle $FLAGS ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.build_type }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
