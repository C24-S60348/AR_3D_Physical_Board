name: Build Release APK

on:
  workflow_dispatch:  # Only runs when manually triggered from GitHub UI/mobile app

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code (with all submodules/patches)
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Setup Java 17 (required by this project)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter (3.41.5 ships with Dart 3.11.5 and works natively with Gradle 8.14)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          cache: true

      # 4. Verify Flutter is ready
      - name: Flutter version
        run: flutter --version

      # 5. Get dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 6. Build release APK
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 7. Upload APK directly as an unzipped downloadable artifact (available for 30 days)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false
          retention-days: 30

      # 8. Show APK file size
      - name: APK info
        run: |
          echo "✅ Build successful!"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
